workflows:
  android-release:
    name: AFTRHRS Android release
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      android_signing:
        - aftrhrs-upload
      vars:
        PACKAGE_NAME: "za.co.aftrhrs"
      java: 17
    scripts:
      - name: Restore Firebase configuration
        script: |
          set -eu
          : "${GOOGLE_SERVICES_JSON_BASE64:?Set GOOGLE_SERVICES_JSON_BASE64 in Codemagic environment variables}"
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > "$CM_BUILD_DIR/app/google-services.json"
          python3 -c 'import json; p=json.load(open("app/google-services.json")); assert any(c.get("client_info",{}).get("android_client_info",{}).get("package_name")=="za.co.aftrhrs" for c in p.get("client",[])), "Firebase config does not contain za.co.aftrhrs"'
      - name: Configure release signing
        script: |
          set -eu
          : "${CM_KEYSTORE_PATH:?Missing Codemagic Android signing identity}"
          : "${CM_KEYSTORE_PASSWORD:?Missing keystore password}"
          : "${CM_KEY_ALIAS:?Missing key alias}"
          : "${CM_KEY_PASSWORD:?Missing key password}"
          python3 - <<'PY'
          import os
          from pathlib import Path
          values = {
              "storeFile": os.environ["CM_KEYSTORE_PATH"],
              "storePassword": os.environ["CM_KEYSTORE_PASSWORD"],
              "keyAlias": os.environ["CM_KEY_ALIAS"],
              "keyPassword": os.environ["CM_KEY_PASSWORD"],
          }
          def escape(value):
              return value.replace("\\", "\\\\").replace("\n", "\\n").replace("\r", "\\r")
          Path("release-signing.properties").write_text("".join(f"{key}={escape(value)}\n" for key, value in values.items()))
          PY
      - name: Build signed release AAB
        script: |
          set -eu
          chmod +x ./gradlew
          ./gradlew :app:bundleRelease --stacktrace
    artifacts:
      - app/build/outputs/bundle/release/*.aab
      - app/build/outputs/mapping/release/mapping.txt
